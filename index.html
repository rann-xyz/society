<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SOCIETY — A community built around people, culture, contribution and trust.">
    <meta name="theme-color" content="#050505">
    <title>SOCIETY — Community & Culture</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Loading screen -->
    <div class="loader" id="loader" aria-hidden="true">
        <div class="loader-text" aria-label="SOCIETY">
            <span>S</span><span>O</span><span>C</span><span>I</span><span>E</span><span>T</span><span>Y</span>
        </div>
        <div class="loader-line"></div>
    </div>

    <!-- Custom cursor -->
    <div class="cursor" id="cursor" aria-hidden="true"></div>
    <div class="cursor-follower" id="cursorFollower" aria-hidden="true"></div>

    <!-- Navigation -->
    <header class="nav" id="nav">
        <a href="#home" class="nav-logo" data-route="home" data-cursor="logo" aria-label="SOCIETY home">
            <img
                src="https://i.ibb.co.com/cBqMG0V/SOCIETY.png"
                alt="SOCIETY"
                class="nav-logo-img"
            >
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
            <a href="#about" class="nav-link" data-route="about" data-cursor="link"><span>01</span> About</a>
            <a href="#people" class="nav-link" data-route="people" data-cursor="link"><span>02</span> People</a>
            <a href="#culture" class="nav-link" data-route="culture" data-cursor="link"><span>03</span> Culture</a>
            <a href="#contribution" class="nav-link" data-route="contribution" data-cursor="link"><span>04</span> Contribution</a>
            <a href="#alpha" class="nav-link" data-route="alpha" data-cursor="link"><span>05</span> Alpha</a>
            <a href="#lab" class="nav-link" data-route="lab" data-cursor="link"><span>06</span> Lab</a>
            <a href="#archive" class="nav-link" data-route="archive" data-cursor="link"><span>07</span> Archive</a>
        </nav>

        <a href="#join" class="nav-join" data-route="join" data-cursor="cta">Join Society</a>

        <button
            class="nav-toggle"
            id="navToggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="mobileMenu"
        >
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Mobile navigation -->
    <aside class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu-inner">
            <a href="#home" class="mobile-link" data-route="home">Home</a>
            <a href="#about" class="mobile-link" data-route="about">About</a>
            <a href="#people" class="mobile-link" data-route="people">People</a>
            <a href="#culture" class="mobile-link" data-route="culture">Culture</a>
            <a href="#contribution" class="mobile-link" data-route="contribution">Contribution</a>
            <a href="#alpha" class="mobile-link" data-route="alpha">Alpha</a>
            <a href="#lab" class="mobile-link" data-route="lab">Lab</a>
            <a href="#archive" class="mobile-link" data-route="archive">Archive</a>
            <a href="#join" class="mobile-link mobile-link-cta" data-route="join">Join Society</a>
        </div>
    </aside>

    <!-- Page transition -->
    <div class="page-transition" id="pageTransition" aria-hidden="true">
        <span>SOCIETY</span>
    </div>

    <!-- Scroll progress -->
    <div class="progress-bar" id="progressBar"></div>

    <!--
        The JavaScript router renders the requested page here.
        Supported routes:
        #home
        #about
        #people
        #culture
        #contribution
        #alpha
        #lab
        #archive
        #join
    -->
    <main id="app" class="app" aria-live="polite"></main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-mark">S</span>
                <div>
                    <strong>SOCIETY</strong>
                    <span>People. Culture. Contribution.</span>
                </div>
            </div>

            <div class="footer-links">
                <a href="#about" data-route="about">About</a>
                <a href="#culture" data-route="culture">Culture</a>
                <a href="#alpha" data-route="alpha">Alpha</a>
                <a href="#lab" data-route="lab">Lab</a>
                <a href="#archive" data-route="archive">Archive</a>
                <a href="#join" data-route="join">Join</a>
            </div>

            <div class="footer-meta">
                <span>© <span id="currentYear">2026</span> SOCIETY</span>
                <span>Built for the culture.</span>
            </div>
        </div>
    </footer>

    <noscript>
        <div class="noscript-message">
            SOCIETY requires JavaScript to use the multi-page navigation experience.
            Please enable JavaScript in your browser.
        </div>
    </noscript>

    <script src="script.js" defer></script>
</body>
</html>
